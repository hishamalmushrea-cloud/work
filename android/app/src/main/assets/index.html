<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d9488" />
  <meta name="description" content="خطة تنفيذية شاملة لمدة 3 سنوات للتحول من موظف إلى صاحب مشروع ناجح" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="دليل ريادة الأعمال" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.svg" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>دليل رائد الأعمال</title>
</head>
<body>
  <div id="app">
    <!-- شاشة البداية -->
    <div id="splash" class="splash">
      <div class="splash-logo">
        <svg viewBox="0 0 200 200" width="120" height="120" aria-hidden="true">
          <defs>
            <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#14b8a6"/>
              <stop offset="100%" stop-color="#0f766e"/>
            </linearGradient>
          </defs>
          <rect x="10" y="10" width="180" height="180" rx="42" fill="url(#sg)"/>
          <path d="M60 130 L88 88 L112 112 L140 70" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="140" cy="70" r="10" fill="#fbbf24"/>
        </svg>
      </div>
      <h1 class="splash-title">دليل رائد الأعمال</h1>
      <p class="splash-sub">من موظف إلى صاحب مشروع ناجح</p>
      <div class="splash-loader"><span></span></div>
    </div>

    <!-- الترويسة -->
    <header class="app-header" id="appHeader" hidden>
      <button id="menuBtn" class="icon-btn" aria-label="القائمة">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
      </button>
      <div class="header-title">
        <h1 id="sectionTitle">الرئيسية</h1>
      </div>
      <div class="header-actions">
        <button id="textSizeBtn" class="icon-btn" aria-label="حجم الخط">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M9 4v3h5v12h3V7h5V4H9zm-6 8h3v7h3v-7h3V9H3v3z"/></svg>
        </button>
        <button id="themeBtn" class="icon-btn" aria-label="الوضع الليلي">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
        </button>
        <button id="installBtn" class="icon-btn install-btn" hidden aria-label="تثبيت التطبيق">
          <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 3a1 1 0 011 1v9.59l3.3-3.3a1 1 0 111.4 1.42l-5 5a1 1 0 01-1.4 0l-5-5a1 1 0 111.4-1.42l3.3 3.3V4a1 1 0 011-1zM4 19a1 1 0 011-1h14a1 1 0 110 2H5a1 1 0 01-1-1z"/></svg>
        </button>
      </div>
    </header>

    <!-- القائمة الجانبية -->
    <div id="drawerOverlay" class="drawer-overlay" hidden></div>
    <nav id="drawer" class="drawer" hidden>
      <div class="drawer-header">
        <svg viewBox="0 0 200 200" width="48" height="48">
          <defs><linearGradient id="sg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#14b8a6"/><stop offset="100%" stop-color="#0f766e"/></linearGradient></defs>
          <rect x="10" y="10" width="180" height="180" rx="42" fill="url(#sg2)"/>
          <path d="M60 130 L88 88 L112 112 L140 70" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="140" cy="70" r="10" fill="#fbbf24"/>
        </svg>
        <div>
          <h2>دليل رائد الأعمال</h2>
          <p>خطة 3 سنوات عملية</p>
        </div>
      </div>
      <ul id="navList" class="nav-list"></ul>
      <div class="drawer-footer">
        <div style="display:flex;gap:10px;justify-content:center;margin-bottom:10px;">
          <button id="exportData" class="btn-primary" style="padding:8px 12px;font-size:12px;">تصدير البيانات</button>
          <button id="importDataBtn" class="btn-primary ghost" style="padding:8px 12px;font-size:12px;">استيراد</button>
          <input type="file" id="importDataFile" accept=".json" hidden>
        </div>
        <button id="resetProgress" class="text-btn">إعادة ضبط التقدم</button>
        <div style="margin-top:12px; padding-top:12px; border-top:1px solid rgba(128,128,128,0.2); text-align:center;">
          <p style="font-size:13px; font-weight:700; margin-bottom:8px; color:var(--text);">للتواصل مع المطور</p>
          <div style="display:flex; gap:12px; justify-content:center; align-items:center;">
            <a href="https://www.instagram.com/eng.almushrea" target="_blank" rel="noopener" style="display:flex; align-items:center; gap:5px; color:var(--teal-600); text-decoration:none; font-size:13px;">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
              eng.almushrea
            </a>
            <a href="mailto:eng.almushrea@gmail.com" style="display:flex; align-items:center; gap:5px; color:var(--teal-600); text-decoration:none; font-size:13px;">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
              البريد
            </a>
          </div>
        </div>
        <p class="version">الإصدار 1.0 — يعمل بدون إنترنت</p>
      </div>
    </nav>

    <!-- المحتوى -->
    <main id="content" class="content" hidden></main>

    <!-- شريط التنقل السفلي -->
    <nav class="bottom-nav" id="bottomNav" hidden>
      <button class="nav-tab active" data-route="home">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>
        <span>الرئيسية</span>
      </button>
      <button class="nav-tab" data-route="plan">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M7 2v2h10V2h2v2h2v18H3V4h2V2zm12 8H5v10h14zM7 6H5v2h14V6h-2v2h-2V6H9v2H7z"/></svg>
        <span>الخطة</span>
      </button>
      <button class="nav-tab" data-route="dashboard">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 13h8V3H3zm0 8h8v-6H3zm10 0h8V11h-8zm0-18v6h8V3z"/></svg>
        <span>متابعتي</span>
      </button>
    </nav>

    <!-- زر العودة للأعلى -->
    <button id="toTop" class="to-top" hidden aria-label="الأعلى">
      <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M7.4 15.4L12 10.8l4.6 4.6L18 14l-6-6-6 6z"/></svg>
    </button>

    <div id="toast" class="toast" hidden></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
